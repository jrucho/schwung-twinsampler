name: Release Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for restore regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify startup restore and host compatibility
        run: bash scripts/test.sh

      - name: Install ARM64 DSP compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build module package
        run: bash scripts/build.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          name: TwinSampler ${{ github.ref_name }}
          files: dist/twinsampler-module.tar.gz
          generate_release_notes: true
