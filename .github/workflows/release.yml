name: Verify Release Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    # Match Move's glibc 2.35 baseline. Newer Ubuntu cross libraries can
    # produce ARM64 binaries which compile successfully but cannot load on Move.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for restore regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const module = read('twinsampler/module.json');
          const source = read('src/module.json');
          const release = read('release.json');
          assert.equal(module.id, 'twinsampler');
          assert.equal(source.version, module.version);
          assert.equal(release.version, module.version);
          assert.equal(process.env.RELEASE_TAG, `v${module.version}`);
          assert.equal(release.download_url, `https://github.com/jrucho/schwung-twinsampler/releases/download/v${module.version}/twinsampler-module.tar.gz`);
          NODE

      - name: Verify startup restore and host compatibility
        run: bash scripts/test.sh

      - name: Install compatible ARM64 compiler and runtime emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Build module package
        run: bash scripts/build.sh

      - name: Verify the exact archive and render audio with its ARM64 DSP
        run: |
          mkdir -p dist/release-check
          tar -xzf dist/twinsampler-module.tar.gz -C dist/release-check
          node scripts/verify-package.mjs dist/release-check/twinsampler
          aarch64-linux-gnu-gcc -O2 -std=c11 tests/pitch_probe.c -o dist/pitch_probe -ldl -lm
          sudo mkdir -p /data/UserData/schwung
          sudo chown "$USER" /data/UserData/schwung
          qemu-aarch64 -L /usr/aarch64-linux-gnu dist/pitch_probe \
            "$PWD/dist/release-check/twinsampler" "$PWD/dist/release-check/pitch-fixture.wav"
          aarch64-linux-gnu-gcc -O2 -std=c11 tests/editor_control_probe.c -o dist/editor_control_probe -ldl -lm
          node tests/editor_control_trace.mjs "$PWD/dist/release-check/control-tone.wav" | \
            qemu-aarch64 -L /usr/aarch64-linux-gnu dist/editor_control_probe \
              "$PWD/dist/release-check/twinsampler" "$PWD/dist/release-check/control-tone.wav"
          node tests/editor_control_trace.mjs "$PWD/dist/release-check/live-tone.wav" live | \
            qemu-aarch64 -L /usr/aarch64-linux-gnu dist/editor_control_probe \
              "$PWD/dist/release-check/twinsampler" "$PWD/dist/release-check/live-tone.wav"
          TS_CONTROL_ONLY=start TS_FIRST_START_MS=6000 node tests/editor_control_trace.mjs "$PWD/dist/release-check/long-tone.wav" | \
            qemu-aarch64 -L /usr/aarch64-linux-gnu dist/editor_control_probe \
              "$PWD/dist/release-check/twinsampler" "$PWD/dist/release-check/long-tone.wav" 6 6000

      - name: Generate verification checksum
        working-directory: dist
        run: sha256sum twinsampler-module.tar.gz > twinsampler-module.tar.gz.sha256

      # This archive is a verification build, not the published asset. The
      # release asset is uploaded from the exact archive already installed and
      # accepted on Move, so store installs receive those verified bytes.
      - name: Keep verification package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: twinsampler-verify-${{ github.ref_name }}
          path: |
            dist/twinsampler-module.tar.gz
            dist/twinsampler-module.tar.gz.sha256
          if-no-files-found: error
